<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>prjT3 Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="centered">
  <main class="card">
    <p class="eyebrow">COMP 4537 Mini-Hackathon</p>
    <h1>Team <span id="team">prjT3</span></h1>

    <form id="login-form" autocomplete="off">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" maxlength="64" required autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" maxlength="64" required>

      <button id="login-button" type="submit">Login</button>
    </form>

    <p id="message" class="message" role="alert" hidden></p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
